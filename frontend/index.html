<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CorteYa: reserva tu turno en la barbería desde el celular, sin llamar ni hacer fila.">
  <meta name="theme-color" content="#14213d">
  <title>CorteYa | Turnos para tu barbería</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <a class="saltar" href="#app">Saltar al contenido</a>

  <header class="encabezado">
    <div class="contenedor encabezado__barra">
      <a class="marca" href="#/" aria-label="CorteYa, ir al inicio">
        <img src="assets/img/logo.svg" alt="" width="32" height="32">
        <span>CorteYa</span>
      </a>
      <button class="menu-boton" type="button" aria-expanded="false" aria-controls="menu-principal">
        <span class="menu-boton__icono" aria-hidden="true"></span>
        <span class="menu-boton__texto">Menú</span>
      </button>
      <nav id="menu-principal" class="menu" aria-label="Navegación principal">
        <ul id="menu-enlaces"></ul>
        <div class="menu__sesion" id="menu-sesion"></div>
      </nav>
    </div>
  </header>

  <p class="banda-modo" id="banda-modo" hidden></p>

  <main id="app" tabindex="-1">
    <noscript><p class="contenedor">CorteYa necesita JavaScript activado para funcionar.</p></noscript>
  </main>

  <footer class="pie">
    <div class="contenedor pie__grid">
      <div>
        <p class="marca marca--pie"><img src="assets/img/logo.svg" alt="" width="24" height="24"> CorteYa</p>
        <p>Plataforma de gestión de turnos para barberías. Proyecto de aula de Ingeniería Web.</p>
      </div>
      <div>
        <p id="pie-negocio"></p>
        <p>Santiago Rios Duque, Isaac Stiven Nuñez Melo y Juan Sebastian Muñoz Melo</p>
      </div>
    </div>
  </footer>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
</body>
</html>
